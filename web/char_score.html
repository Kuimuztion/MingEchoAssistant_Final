<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色评分 - 鸣潮助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0d13;
    color: #c8cdd5;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 30px 20px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  .loading {
    text-align: center;
    padding: 80px 20px;
  }
  .loading-text {
    font-size: 22px;
    color: #c9a24b;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #1e2533;
    border-top-color: #c9a24b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1e2533;
  }
  .char-icon {
    width: 64px; height: 64px;
    border-radius: 12px;
    background: #11151f;
    border: 2px solid #c9a24b;
    overflow: hidden;
  }
  .char-icon img { width:100%; height:100%; object-fit:cover; }
  .char-info h1 { font-size: 22px; color: #fff; }
  .char-info .sub { font-size: 13px; color: #6fc3df; margin-top: 4px; }
  .back-btn {
    padding: 8px 18px;
    background: #11151f;
    border: 1px solid #1e2533;
    border-radius: 8px;
    color: #c8cdd5;
    text-decoration: none;
    font-size: 13px;
    cursor: pointer;
  }
  .back-btn:hover { border-color: #c9a24b; color: #c9a24b; }
  .save-btn {
    padding: 8px 18px;
    background: linear-gradient(135deg, #c9a24b, #a8862f);
    border: 1px solid #c9a24b;
    border-radius: 8px;
    color: #0a0d13;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
  }
  .save-btn:hover { opacity: 0.85; }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .score-card {
    background: #11151f;
    border: 1px solid #1e2533;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .score-card-title {
    font-size: 15px;
    font-weight: 600;
    color: #c9a24b;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .total-score {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .score-circle {
    width: 80px; height: 80px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .score-circle svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .score-circle-inner {
    position: relative;
    z-index: 1;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #11151f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #c9a24b;
  }
  .score-desc { flex: 1; }
  .score-grade {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .grade-S { color: #c9a24b; }
  .grade-A { color: #6fc3df; }
  .grade-B { color: #7cb342; }
  .grade-C { color: #ff9800; }
  .grade-D { color: #e57373; }
  .score-comment { font-size: 13px; color: #8a93a3; line-height: 1.7; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-item {
    background: rgba(0,0,0,0.2);
    border: 1px solid #1e2533;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-name { font-size: 12px; color: #8a93a3; margin-bottom: 4px; }
  .stat-value { font-size: 16px; font-weight: 600; color: #fff; }
  .stat-bar {
    height: 4px;
    background: #1e2533;
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a24b, #6fc3df);
    border-radius: 2px;
  }
  .stat-target { font-size: 11px; color: #6fc3df; margin-top: 3px; }

  .echo-list { display: flex; flex-direction: column; gap: 10px; }
  .echo-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.2);
    border: 1px solid #1e2533;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .echo-icon {
    width: 48px; height: 48px;
    border-radius: 8px;
    background: #0a0d13;
    flex-shrink: 0;
    overflow: hidden;
  }
  .echo-icon img { width:100%; height:100%; object-fit:cover; }
  .echo-info { flex: 1; min-width: 0; }
  .echo-name { font-size: 14px; font-weight: 600; color: #fff; }
  .echo-meta { font-size: 11px; color: #8a93a3; margin-top: 2px; }
  .echo-stats { font-size: 12px; color: #a0a8b3; margin-top: 4px; line-height: 1.5; }
  .echo-score {
    text-align: center;
    flex-shrink: 0;
    width: 60px;
  }
  .echo-score-num {
    font-size: 24px;
    font-weight: 700;
  }
  .echo-score-label { font-size: 10px; color: #8a93a3; margin-top: 2px; }

  .target-panel {
    background: rgba(0,0,0,0.15);
    border: 1px solid #1e2533;
    border-radius: 8px;
    padding: 14px;
    font-size: 12px;
    color: #a0a8b3;
    line-height: 1.9;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
  }
  .error-box {
    text-align: center;
    padding: 40px 20px;
    color: #e57373;
  }
</style>
<script src="/js/html2canvas.min.js"></script>
</head>
<body>
<div class="container">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text" style="margin-top:20px">本地C后端评价中...</div>
  </div>
  <div id="content" style="display:none"></div>
</div>

<script>
const Api = {
  async json(url, body) {
    const opt = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {};
    const r = await fetch(url, opt);
    return r.json();
  }
};

/* 调用 Agnes AI 进行评分（SSE流式，收集完整响应后解析JSON） */
async function callAgnesForScoring(detail, charPanel, charName) {
  const role = detail.role || {};
  const attrList = detail.roleAttributeList || [];
  const weaponData = detail.weaponData || {};
  const weapon = weaponData.weapon || {};
  const phantomData = detail.phantomData || {};
  const echoes = (phantomData.equipPhantomList || []).filter(e => e && e.phantomProp);

  /* 组装面板属性文本 */
  let attrText = '';
  for (const a of attrList) {
    attrText += `- ${a.attributeName}: ${a.attributeValue}\n`;
  }

  /* 组装武器信息 */
  const weaponMain = (weaponData.mainPropList || []).map(p => `${p.attributeName}=${p.attributeValue}`).join(', ');
  const weaponText = `名称: ${weapon.weaponName || '未知'}\n星级: ${weapon.weaponStarLevel || '?'}\n等级: ${weaponData.level || '?'}\n突破: ${weaponData.breach || 0}\n主属性: ${weaponMain}\n技能: ${weapon.weaponEffectName || '-'}`;

  /* 组装声骸列表 */
  let echoText = '';
  echoes.forEach((e, i) => {
    const prop = e.phantomProp || {};
    const mains = (e.mainProps || []).map(p => `${p.attributeName}=${p.attributeValue}`).join(', ');
    const subs = (e.subProps || []).map(p => `${p.attributeName}=${p.attributeValue}`).join(', ');
    echoText += `声骸${i+1}: ${prop.name || '未知'} (COST${e.cost}, Lv${e.level}, ${e.quality}星)\n  主词条: ${mains}\n  副词条: ${subs || '无'}\n`;
  });

  const systemPrompt = '你是鸣潮(Wuthering Waves)游戏的角色配装评分专家。请根据目标面板和玩家实际数据，对角色进行全面评分。严格只返回JSON格式，不要任何其他文字、解释或markdown代码块标记。JSON格式必须包含：{"panel_score":0-100整数,"weapon_score":0-100整数,"chain_score":0-100整数,"echo_scores":[{"name":"声骸名称","score":0-100整数,"comment":"10字以内简短评语"}],"suggestions":["第一条建议","第二条建议"]}。\n\n【评分标准-极其重要】\n1. 以「小毕业」为及格基准线：全部核心属性达到小毕业要求 = 70分（B级）\n2. 以「大毕业」为优秀基准线：全部核心属性达到大毕业要求 = 90分（A级）\n3. 在小毕业和大毕业之间，根据各属性实际超出小毕业的程度线性加分\n4. 即使有1-2个属性略低于小毕业（差距<15%），只要其他属性达标甚至超出，整体评分不应低于65分\n5. 绝对不要因为单一属性不达标就把整体评分压到60分以下\n6. 大部分属性达标时，整体评分应在70-85分之间\n7. 面板评分只看角色面板属性，不考虑武器和声骸（武器和声骸单独评分）\n8. 辅助/奶妈角色不看暴击暴伤，只看其目标面板中列出的核心属性\n\nsuggestions数组最多2条，每条不超过30字，只建议最需要提升的属性。echo_scores数组数量必须与玩家实际装备的声骸数量一致，按装备顺序排列。';

  const userPrompt = `【角色】${charName} (${role.attributeName || ''}属性, Lv${role.level || '?'}, 共鸣链${role.chainUnlockNum || 0}/6)

【目标面板（评分基准）】
${charPanel.raw || JSON.stringify(charPanel, null, 2)}

【玩家实际面板属性】
${attrText}

【评分提醒】
- 请对照上方「小毕业」和「大毕业」的具体数值来评分
- 小毕业全部达标=70分，大毕业全部达标=90分
- 大部分属性达标时，即使1个属性略低，整体也应在70-80分
- 不要因为单一属性未达标就把整体压到65分以下

【武器】
${weaponText}

【声骸配置（共${echoes.length}件）】
${echoText}

请对以上角色进行全面评分，返回JSON。`;

  /* 调用 /api/chat SSE */
  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ]})
  });

  if (!resp.ok) throw new Error('AI 请求失败: ' + resp.status);

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let fullContent = '';
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const dataStr = line.slice(6).trim();
        if (!dataStr || dataStr === '[DONE]') continue;
        try {
          const data = JSON.parse(dataStr);
          if (data.error) throw new Error(data.error);
          const delta = data.choices?.[0]?.delta?.content;
          if (delta) fullContent += delta;
        } catch(e) { /* 忽略非JSON行 */ }
      }
    }
  }

  /* 解析AI返回的JSON（可能被markdown代码块包裹） */
  let jsonStr = fullContent.trim();
  jsonStr = jsonStr.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '');
  /* 提取第一个{到最后一个} */
  const firstBrace = jsonStr.indexOf('{');
  const lastBrace = jsonStr.lastIndexOf('}');
  if (firstBrace >= 0 && lastBrace > firstBrace) {
    jsonStr = jsonStr.slice(firstBrace, lastBrace + 1);
  }
  return JSON.parse(jsonStr);
}

/* 解析目标面板中的数值阈值 */
function parseTarget(panelText) {
  const target = { crit:0, critDmg:0, atk:0, resonance:0, priority:'', element:'', weapons:[] };
  const lines = panelText.split('\n');
  for (const line of lines) {
    const m = line.match(/小毕业：暴击\s*≥\s*([\d.]+)%?.*?暴击伤害\s*≥\s*([\d.]+)%?.*?攻击\s*≥\s*([\d.]+).*?共鸣效率\s*≥\s*([\d.]+)%?/);
    if (m) {
      target.crit = parseFloat(m[1]);
      target.critDmg = parseFloat(m[2]);
      target.atk = parseFloat(m[3]);
      target.resonance = parseFloat(m[4]);
    }
    const pm = line.match(/优先级：(.+)/);
    if (pm) target.priority = pm[1].trim();
    const em = line.match(/定位：[^(]*\(([^/]+)/);
    if (em) target.element = em[1].trim();
    const wm = line.match(/武器：(.+)/);
    if (wm) {
      target.weapons = wm[1].split(/[>、]/).map(s => s.trim()).filter(s => s);
    }
  }
  return target;
}

/* 数值格式化：最多两位小数，去掉末尾多余的0 */
function fmt(v) {
  if (typeof v !== 'number' || isNaN(v)) return v;
  return parseFloat(v.toFixed(2)).toString();
}

/* 从角色属性列表中提取数值（精确匹配，避免"暴击"匹配到"暴击伤害"） */
function getStat(attrList, name) {
  if (!attrList) return 0;
  for (const a of attrList) {
    if (a.attributeName && a.attributeName === name) {
      const v = parseFloat(a.attributeValue);
      return isNaN(v) ? 0 : v;
    }
  }
  return 0;
}

/* 模糊匹配（用于伤害加成等可能带前缀的属性） */
function getStatLike(attrList, keyword) {
  if (!attrList) return 0;
  for (const a of attrList) {
    if (a.attributeName && a.attributeName.includes(keyword)) {
      const v = parseFloat(a.attributeValue);
      return isNaN(v) ? 0 : v;
    }
  }
  return 0;
}

/* 计算单项得分 */
function statScore(actual, target) {
  if (target <= 0) return 60;
  if (actual >= target * 1.1) return 100;
  if (actual >= target) return 90;
  return Math.min(90, Math.max(0, (actual / target) * 90));
}

/* 计算声骸得分 */
function echoScore(echo, target, charElement) {
  let score = 40; // 基础分
  let reasons = [];

  /* 主词条匹配（正确只加10分，主要分数来自副词条） */
  if (echo.mainProps && echo.mainProps.length > 0) {
    const mainName = echo.mainProps[0].attributeName || '';
    const cost = echo.cost || 0;
    let mainCorrect = false;
    if (cost >= 4) {
      mainCorrect = mainName.includes('暴击') || mainName.includes('暴伤') || mainName.includes('治疗');
    } else if (cost === 3) {
      mainCorrect = mainName.includes('伤害加成') || mainName.includes('共鸣效率') || (mainName.includes('攻击') && mainName.includes('%'));
    } else {
      mainCorrect = mainName.includes('攻击') || mainName.includes('生命') || mainName.includes('防御');
    }
    if (mainCorrect) { score += 10; reasons.push('主词条正确✓'); }
    else { score += 3; reasons.push('主词条一般'); }
  }

  /* 副词条质量（使用角色目标面板的"有效词条目标"判断） */
  if (echo.subProps && echo.subProps.length > 0) {
    let goodSubs = 0;
    const validKeywords = (target && target.valid_keywords) ? target.valid_keywords : [];
    for (const s of echo.subProps) {
      const n = s.attributeName || '';
      if (!n) continue;
      if (validKeywords.length > 0) {
        /* 有有效词条目标：严格按目标判断 */
        const isGood = validKeywords.some(kw => {
          const kwClean = kw.replace(/百分比|固定|加成|伤害/g, '');
          const nClean = n.replace(/百分比|固定|加成|伤害/g, '');
          return n.includes(kw) || kw.includes(n) || nClean.includes(kwClean) || kwClean.includes(nClean);
        });
        if (isGood) goodSubs++;
      } else {
        /* 奶妈等无有效词条目标的角色：共鸣效率/生命/治疗算优质 */
        if (n.includes('共鸣效率') || n.includes('生命') || n.includes('治疗') || n.includes('防御')) goodSubs++;
      }
    }
    score += Math.min(20, goodSubs * 5);
    if (goodSubs >= 3) reasons.push('副词条优质✓');
  }

  /* 等级 */
  const lv = echo.level || 0;
  score += Math.min(15, lv * 0.5);

  return { score: Math.min(100, Math.round(score)), reasons };
}

/* 等级评价 */
function grade(score) {
  if (score >= 90) return { label:'S', cls:'grade-S' };
  if (score >= 75) return { label:'A', cls:'grade-A' };
  if (score >= 60) return { label:'B', cls:'grade-B' };
  if (score >= 45) return { label:'C', cls:'grade-C' };
  return { label:'D', cls:'grade-D' };
}

async function main() {
  const params = new URLSearchParams(location.search);
  const roleId = params.get('roleId') || '';
  const serverId = params.get('serverId') || '';
  const charId = params.get('charId') || '';
  const charName = params.get('name') || '';
  const charIcon = params.get('icon') || '';

  if (!roleId || !serverId || !charId) {
    showError('缺少参数：roleId / serverId / charId');
    return;
  }

  try {
    /* 1. 获取 b-at */
    const tokenResp = await Api.json('/api/kuro/proxy', {
      path: '/aki/roleBox/requestToken',
      form: 'serverId=' + encodeURIComponent(serverId) + '&roleId=' + encodeURIComponent(roleId)
    });
    let bat = '';
    if (tokenResp.data) {
      try { bat = JSON.parse(tokenResp.data).accessToken; } catch(e) {}
    }
    if (!bat) {
      showError('获取访问凭证失败，请检查游戏账户连接状态');
      return;
    }

    /* 2. 获取角色详情 */
    const detailResp = await Api.json('/api/kuro/proxy', {
      path: '/aki/roleBox/akiBox/getRoleDetail',
      form: 'serverId=' + encodeURIComponent(serverId) + '&roleId=' + encodeURIComponent(roleId) + '&id=' + encodeURIComponent(charId),
      headers: JSON.stringify({ 'b-at': bat })
    });
    if (detailResp.code !== 200 && detailResp.code !== 10902) {
      showError('获取角色详情失败：' + (detailResp.msg || detailResp.code));
      return;
    }
    const detail = JSON.parse(detailResp.data);

    /* 3. 获取目标面板 JSON（所有角色的结构化面板数据） */
    let panelData = {};
    try {
      const panelResp = await fetch('/character_panels.json');
      panelData = await panelResp.json();
    } catch(e) { console.warn('character_panels.json 加载失败', e); }
    const charPanel = panelData[charName] || {};

    /* 4. 渲染结果（本地C后端算法评分） */
    renderResult(detail, charPanel, charName, charIcon, roleId, serverId, charId);

  } catch (e) {
    console.error(e);
    showError('评价过程出错：' + e.message);
  }
}

function renderResult(detail, charPanel, charName, charIcon, roleId, serverId, charId) {
  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('content');
  content.style.display = 'block';

  const role = detail.role || {};
  const attrList = detail.roleAttributeList || [];

  /* 从目标面板动态提取核心属性（每个角色不同） */
  const smallGrad = charPanel.small_graduate || {};
  const priorityStr = charPanel.priority || '';
  const targetWeapons = charPanel.weapons || [];

  /* 属性名映射：目标面板名 → API字段名（大部分一致，个别需要转换） */
  const statMap = {
    '暴击': '暴击', '暴击率': '暴击',
    '暴击伤害': '暴击伤害', '暴伤': '暴击伤害',
    '攻击': '攻击', '攻击力': '攻击',
    '共鸣效率': '共鸣效率',
    '生命': '生命', '生命值': '生命',
    '防御': '防御', '防御力': '防御',
    '治疗效果加成': '治疗效果加成',
    '能量回复': '能量回复', '能量回复效率': '能量回复',
  };

  /* 动态构建核心属性列表 */
  const coreStats = [];
  for (const [statName, statInfo] of Object.entries(smallGrad)) {
    const apiName = statMap[statName] || statName;
    const actual = getStat(attrList, apiName);
    const targetVal = statInfo.value;
    const unit = statInfo.unit || '';
    const score = statScore(actual, targetVal);
    coreStats.push({ name: statName, apiName, actual, target: targetVal, unit, score, isCore: true });
  }

  /* 加入伤害加成范围评分（小毕业中的追加内容，如"热熔伤害加成约45%~60%"） */
  const damageBonuses = charPanel.small_damage_bonuses || [];
  for (const db of damageBonuses) {
    const actual = getStat(attrList, db.name);
    let dbScore = 50;
    if (actual > 0 && db.min > 0) {
      if (actual >= db.min && actual <= db.max) {
        /* 在目标范围内：90分 */
        dbScore = 90;
      } else if (actual > db.max) {
        /* 超出上限：满配，100分 */
        dbScore = 100;
      } else {
        /* 低于下限：按比例给分 */
        dbScore = Math.round((actual / db.min) * 70);
      }
    }
    coreStats.push({
      name: db.name,
      apiName: db.name,
      actual,
      target: db.min + '~' + db.max,
      unit: db.unit || '%',
      score: dbScore,
      isCore: false,
      isDamageBonus: true
    });
  }

  /* 根据优先级动态计算权重 */
  const priorityItems = priorityStr.split(/\s*[>、]\s*/).map(s => s.trim()).filter(s => s);
  function getWeight(statName) {
    /* 在优先级列表中的位置越靠前权重越高 */
    for (let i = 0; i < priorityItems.length; i++) {
      const item = priorityItems[i];
      if (item.includes(statName) || statName.includes(item.replace(/百分比|固定|加成/g,''))) {
        return Math.max(0.1, 0.35 - i * 0.06);
      }
    }
    /* "暴击/暴伤" 这种组合需要特殊处理 */
    if ((statName === '暴击' || statName === '暴击伤害') && priorityItems.some(p => p.includes('暴击') || p.includes('暴伤'))) {
      const idx = priorityItems.findIndex(p => p.includes('暴击') || p.includes('暴伤'));
      return Math.max(0.1, 0.35 - idx * 0.06);
    }
    return 0.15; /* 默认权重 */
  }

  /* 计算主面板总分（核心属性加权平均） */
  let totalWeight = 0;
  let weightedSum = 0;
  for (const cs of coreStats) {
    let w;
    if (cs.isDamageBonus) {
      w = 0.1; /* 伤害加成权重较低 */
    } else {
      w = getWeight(cs.name);
    }
    cs.weight = w;
    weightedSum += cs.score * w;
    totalWeight += w;
  }
  /* 主面板总分（核心属性加权平均） */
  const panelScore = totalWeight > 0 ? Math.round(weightedSum / totalWeight) : 50;

  /* 武器评分 */
  const weaponData = detail.weaponData || {};
  const weapon = weaponData.weapon || {};
  const weaponName = weapon.weaponName || '';
  const weaponStar = weapon.weaponStarLevel || 0;
  const weaponLevel = weaponData.level || 0;
  let weaponScore = 40;
  if (weaponName && targetWeapons.length > 0) {
    const idx = targetWeapons.findIndex(w => weaponName.includes(w) || w.includes(weaponName));
    if (idx === 0) weaponScore = 95;
    else if (idx === 1) weaponScore = 80;
    else if (idx >= 2) weaponScore = 65;
    else weaponScore = 50;
  }
  if (weaponStar >= 5) weaponScore += 5;
  weaponScore = Math.min(100, weaponScore + Math.min(10, weaponLevel * 0.1));

  /* 共鸣链评分 */
  const chainNum = role.chainUnlockNum || 0;
  let chainScore = 40;
  if (chainNum >= 6) chainScore = 100;
  else if (chainNum >= 5) chainScore = 90;
  else if (chainNum >= 4) chainScore = 78;
  else if (chainNum >= 3) chainScore = 65;
  else if (chainNum >= 2) chainScore = 55;
  else if (chainNum >= 1) chainScore = 48;

  /* 综合总分：面板70% + 武器15% + 共鸣链15% */
  const total = Math.round(panelScore * 0.7 + weaponScore * 0.15 + chainScore * 0.15);
  const g = grade(total);

  /* 角色元素 */
  const charElement = (role.attributeName || '').trim();
  const elementDmgKey = charElement + '伤害加成';
  const elementDmg = getStat(attrList, elementDmgKey);

  /* 其他伤害加成（有值才显示） */
  const dmgBonusNames = ['共鸣技能伤害加成','普攻伤害加成','共鸣解放伤害加成','重击伤害加成','冷凝伤害加成','热熔伤害加成','衍射伤害加成','湮灭伤害加成','气动伤害加成','导电伤害加成','治疗效果加成'];
  const otherDmgBonuses = [];
  for (const dn of dmgBonusNames) {
    const v = getStat(attrList, dn);
    if (v > 0 && dn !== elementDmgKey) otherDmgBonuses.push({ name: dn, value: v });
  }

  let html = '';

  /* 头部 */
  html += '<div class="header">';
  html += '<div class="char-icon">' + (charIcon ? '<img src="' + charIcon + '">' : '') + '</div>';
  html += '<div class="char-info"><h1>' + escapeHtml(charName) + '</h1>';
  html += '<div class="sub">Lv.' + (role.level || '?') + ' · ' + escapeHtml(role.attributeName || '') + ' · ' + (role.starLevel || '?') + '星</div></div>';
  html += '<button class="save-btn" id="savePageBtn" onclick="savePageAsImage(this)">保存到本机</button>';
  html += '<a class="back-btn" href="javascript:;" onclick="window.close();">返回角色列表</a>';
  html += '</div>';

  /* 总评分 */
  html += '<div class="score-card">';
  html += '<div class="score-card-title">主面板综合评分</div>';
  html += '<div class="total-score">';
  /* SVG 圆环（html2canvas 兼容） */
  const circleR = 36;
  const circumference = 2 * Math.PI * circleR;
  const circleOffset = circumference * (1 - Math.min(100, Math.max(0, total)) / 100);
  html += '<div class="score-circle">';
  html += '<svg viewBox="0 0 80 80">';
  html += '<circle cx="40" cy="40" r="' + circleR + '" fill="none" stroke="#1e2533" stroke-width="8"/>';
  html += '<circle cx="40" cy="40" r="' + circleR + '" fill="none" stroke="#c9a24b" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + circumference.toFixed(2) + '" stroke-dashoffset="' + circleOffset.toFixed(2) + '" transform="rotate(-90 40 40)"/>';
  html += '</svg>';
  html += '<div class="score-circle-inner">' + total + '</div>';
  html += '</div>';
  html += '<div class="score-desc">';
  html += '<div class="score-grade ' + g.cls + '">评级：' + g.label + '</div>';
  html += '</div></div></div>';

  /* 属性详情（核心属性来自目标面板，动态生成） */
  html += '<div class="stat-grid">';
  const statItems = [];
  /* 核心评分属性 */
  const scoredStatNames = new Set();
  for (const cs of coreStats) {
    statItems.push({ name: cs.name, value: fmt(cs.actual) + cs.unit, target: fmt(cs.target) + cs.unit, score: cs.score });
    scoredStatNames.add(cs.name);
  }
  /* 生命/防御参考（不评分） */
  const hp = getStat(attrList, '生命');
  const def = getStat(attrList, '防御');
  if (hp > 0 && !scoredStatNames.has('生命')) statItems.push({ name:'生命值', value:fmt(hp), target:'-', score:null });
  if (def > 0 && !scoredStatNames.has('防御')) statItems.push({ name:'防御力', value:fmt(def), target:'-', score:null });
  /* 元素伤害加成（有值才显示，且未在评分属性中） */
  if (elementDmg > 0 && !scoredStatNames.has(charElement + '伤害加成')) {
    statItems.push({ name:charElement + '伤害加成', value:fmt(elementDmg) + '%', target:'-', score: Math.min(100, 50 + elementDmg * 2) });
  }
  /* 其他伤害加成（有值才显示，且未在评分属性中） */
  for (const db of otherDmgBonuses) {
    if (!scoredStatNames.has(db.name)) {
      statItems.push({ name: db.name, value: fmt(db.value) + '%', target:'-', score: null });
    }
  }
  for (const s of statItems) {
    html += '<div class="stat-item">';
    html += '<div class="stat-name">' + s.name + '</div>';
    html += '<div class="stat-value">' + s.value + '</div>';
    if (s.score !== null) {
      html += '<div class="stat-bar"><div class="stat-bar-fill" style="width:' + Math.round(s.score) + '%"></div></div>';
      html += '<div class="stat-target">目标：' + s.target + ' · 得分 ' + Math.round(s.score) + '</div>';
    }
    html += '</div>';
  }
  html += '</div></div>';

  /* 武器卡片 */
  if (weaponName) {
    const wg = grade(weaponScore);
    const weaponMainStr = (weaponData.mainPropList || []).map(p => p.attributeName + ' ' + fmt(parseFloat(p.attributeValue))).join(' · ');
    html += '<div class="score-card">';
    html += '<div class="score-card-title">武器评分</div>';
    html += '<div class="echo-item">';
    html += '<div class="echo-icon">' + (weapon.weaponIcon ? '<img src="' + weapon.weaponIcon + '">' : '') + '</div>';
    html += '<div class="echo-info">';
    html += '<div class="echo-name">' + escapeHtml(weaponName) + '</div>';
    html += '<div class="echo-meta">' + weaponStar + '星 · Lv.' + weaponLevel + ' · 突破' + (weaponData.breach || 0) + '阶' + (weaponData.resonLevel ? ' · 共鸣' + weaponData.resonLevel + '级' : '') + '</div>';
    if (weaponMainStr) html += '<div class="echo-stats"><b>主属性：</b>' + escapeHtml(weaponMainStr) + '</div>';
    if (weapon.weaponEffectName) html += '<div class="echo-stats" style="margin-top:4px;color:#8a93a3"><b>技能：</b>' + escapeHtml(weapon.weaponEffectName) + '</div>';
    if (targetWeapons.length > 0) {
      html += '<div class="echo-stats" style="margin-top:4px;color:#6fc3df"><b>推荐优先级：</b>' + escapeHtml(targetWeapons.join(' > ')) + '</div>';
    }
    html += '</div>';
    html += '<div class="echo-score"><div class="echo-score-num ' + wg.cls + '">' + weaponScore + '</div><div class="echo-score-label">' + wg.label + '级</div></div>';
    html += '</div></div>';
  }

  /* 共鸣链卡片 */
  html += '<div class="score-card">';
  html += '<div class="score-card-title">共鸣链</div>';
  const cg = grade(chainScore);
  html += '<div style="display:flex;align-items:center;gap:20px">';
  html += '<div style="flex:1">';
  /* 共鸣链格子 0-6 */
  html += '<div style="display:flex;gap:6px;margin-bottom:10px">';
  for (let i = 0; i <= 6; i++) {
    const unlocked = i <= chainNum;
    html += '<div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;' + (unlocked ? 'background:linear-gradient(135deg,#c9a24b,#a8862f);color:#0a0d13;' : 'background:#11151f;border:1px solid #1e2533;color:#3a4252;') + '">' + i + '</div>';
  }
  html += '</div>';
  html += '<div style="font-size:13px;color:#a0a8b3">当前共鸣链：' + chainNum + ' / 6</div></div>';
  html += '<div class="echo-score"><div class="echo-score-num ' + cg.cls + '">' + chainScore + '</div><div class="echo-score-label">' + cg.label + '级</div></div>';
  html += '</div></div>';

  /* 声骸评分 */
  const phantomData = detail.phantomData || {};
  const echoes = (phantomData.equipPhantomList || []).filter(e => e && e.phantomProp);
  if (echoes.length > 0) {
    html += '<div class="score-card">';
    html += '<div class="score-card-title">声骸评分（' + echoes.length + '件）</div>';
    html += '<div class="echo-list">';
    for (const echo of echoes) {
      const es = echoScore(echo, charPanel, charElement);
      const eg = grade(es.score);
      const prop = echo.phantomProp || {};
      const mainStr = (echo.mainProps || []).map(p => p.attributeName + ' ' + fmt(parseFloat(p.attributeValue))).join(' · ');
      const subStr = (echo.subProps || []).map(p => p.attributeName + ' ' + fmt(parseFloat(p.attributeValue))).join(' · ');
      html += '<div class="echo-item">';
      html += '<div class="echo-icon">' + (prop.iconUrl ? '<img src="' + prop.iconUrl + '">' : '') + '</div>';
      html += '<div class="echo-info">';
      html += '<div class="echo-name">' + escapeHtml(prop.name || '未知声骸') + '</div>';
      html += '<div class="echo-meta">COST ' + (echo.cost || '?') + ' · Lv.' + (echo.level || '?') + ' · ' + (echo.quality || '?') + '星</div>';
      html += '<div class="echo-stats"><b>主：</b>' + escapeHtml(mainStr) + (subStr ? '<br><b>副：</b>' + escapeHtml(subStr) : '') + '</div>';
      html += '</div>';
      html += '<div class="echo-score">';
      html += '<div class="echo-score-num ' + eg.cls + '">' + es.score + '</div>';
      html += '<div class="echo-score-label">' + eg.label + '级</div>';
      html += '</div></div>';
    }
    html += '</div></div>';
  }

  /* 目标面板参考 */
  if (charPanel.raw) {
    html += '<div class="score-card">';
    html += '<div class="score-card-title">目标面板参考（评分基准）</div>';
    html += '<div class="target-panel">' + escapeHtml(charPanel.raw) + '</div>';
    html += '</div>';
  }

  content.innerHTML = html;
}

/* 保存整个评分页面为图片 */
function savePageAsImage(btn) {
  if (typeof html2canvas === 'undefined') {
    alert('截图库加载失败，请刷新页面后重试');
    return;
  }
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = '正在生成截图...';

  /* 滚动到顶部，确保从页面最上方开始截取 */
  window.scrollTo(0, 0);

  setTimeout(() => {
    html2canvas(document.body, {
      backgroundColor: '#0a0d13',
      scale: 2,
      useCORS: true,
      allowTaint: true,
      logging: false,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    }).then(canvas => {
      /* 从DOM获取角色名作为文件名 */
      const charNameEl = document.querySelector('.char-info h1');
      const charName = charNameEl ? charNameEl.textContent.trim() : '角色';
      const fileName = charName + '_角色评分_' + new Date().toISOString().slice(0, 10) + '.png';

      /* 转换为图片并触发下载 */
      const link = document.createElement('a');
      link.download = fileName;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      btn.textContent = '保存成功';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.disabled = false;
      }, 1500);
    }).catch(err => {
      console.error('截图失败:', err);
      alert('截图生成失败：' + err.message);
      btn.textContent = originalText;
      btn.disabled = false;
    });
  }, 100);
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').innerHTML = '<div class="error-box"><h2 style="margin-bottom:12px">评价失败</h2><p>' + escapeHtml(msg) + '</p><p style="margin-top:16px"><a href="javascript:;" onclick="window.close();" style="color:#6fc3df">返回角色列表</a></p></div>';
  document.getElementById('content').style.display = 'block';
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

main();
</script>
