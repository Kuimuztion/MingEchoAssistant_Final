<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/res/ui/app.png" />
<title>联系开发者 - 鸣潮攻略站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0d13;
    background-image:
      linear-gradient(rgba(10,13,19,.55),rgba(10,13,19,.62)),
      url('/res/Background/%E5%AE%88%E5%B2%B8%E4%BA%BA.png');
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #e6e8ee;
    font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 40px 24px;
  }
  .card {
    max-width: 560px; width:100%;
    background: linear-gradient(168deg,rgba(26,33,46,.92),rgba(16,21,31,.94));
    border:1px solid #2e384a; border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    padding: 36px 40px; text-align:center;
  }
  .title { font-size:30px; font-weight:700; color:#c9a24b; letter-spacing:3px; margin-bottom:26px; }
  .line { font-size:15px; color:#c8cdd5; line-height:2.2; }
  .issue-link {
    display:inline-block; margin:18px 0 8px;
    font-size:19px; font-weight:700; color:#6fc3df;
    text-decoration:none; letter-spacing:1px;
    border-bottom:1px dashed rgba(111,195,223,.5); padding-bottom:2px;
    transition:all .15s;
  }
  .issue-link:hover { color:#8fd8ef; border-color:#8fd8ef; }
  .group-title { font-size:17px; font-weight:600; color:#e8d4a0; margin-top:20px; letter-spacing:2px; }
  .pics { display:flex; gap:18px; align-items:center; justify-content:center; margin-top:16px; }
  .pics img { height:230px; width:auto; max-width:100%; border-radius:10px; }
  .pics img.qr { border:2px solid rgba(201,162,75,.5); background:#fff; }
  .back {
    display:inline-block; margin-top:26px; padding:7px 16px; border-radius:8px;
    background:#141a26; border:1px solid #2a3346; color:#c8cdd5;
    font-size:12px; text-decoration:none; transition:all .15s;
  }
  .back:hover { border-color:#c9a24b; color:#c9a24b; }
</style>
</head>
<body>
<div class="card">
  <div class="title">怎么联系开发者？</div>
  <div class="line">QQ联系：3623241078</div>
  <div class="line">邮箱联系：mikulxz08@gmail.com</div>
  <div><a class="issue-link" href="https://github.com/Kuimuztion/MingEchoAssistant_Final" target="_blank" rel="noopener">我不想联系，直接去提issues!</a></div>
  <div class="group-title">我们的鸣潮小团体：</div>
  <div class="pics">
    <img class="qr" src="/res/Pictures/小团体.jpg" alt="鸣潮小团体群二维码" onerror="this.style.display='none'">
    <img src="/res/Pictures/守岸人.gif" alt="守岸人" onerror="this.style.display='none'">
  </div>
  <a class="back" href="javascript:;" onclick="window.close();">← 关闭页面</a>
</div>
</body>
</html>
