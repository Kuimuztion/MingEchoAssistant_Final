<title>角色配队 - 鸣潮攻略站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
/* 滚动条（与主界面一致） */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2a3342; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a4557; }
::-webkit-scrollbar-track { background: transparent; }

  img, * { -webkit-user-drag:none; user-select:none; -webkit-user-select:none; }
  body {
    background: #0a0d13;
    background-image: radial-gradient(1200px 700px at 50% -20%, #14202e 0%, #0a0d13 60%);
    color: #e6e8ee;
    font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
    min-height: 100vh;
    padding: 28px 32px 48px;
  }
  .wrap { max-width: 1280px; margin:0 auto; }

  /* 顶部 */
  .top-bar { display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .back-btn {
    display:inline-block; padding:8px 18px; border-radius:8px;
    background:#141a26; border:1px solid #2a3346; color:#c8cdd5;
    font-size:13px; text-decoration:none; cursor:pointer; transition:all .15s;
  }
  .back-btn:hover { border-color:#c9a24b; color:#c9a24b; }
  .top-title { font-size:22px; font-weight:700; color:#c9a24b; letter-spacing:2px; }
  .top-sub { font-size:13px; color:#7a8499; margin-left:4px; }

  /* 配队卡片行 */
  .team-row { display:flex; gap:26px; justify-content:center; flex-wrap:wrap; margin-bottom:30px; }

  /* 单张竖版角色卡 */
  .role-card {
    position:relative; width:360px; height:560px; border-radius:14px; overflow:hidden;
    background: rgba(18,24,34,.62);
    border:1px solid #2e384a;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    flex-shrink:0;
  }
  /* 大号序号水印 */
  .card-index {
    position:absolute; left:6px; top:18px; z-index:1;
    font-family:Georgia,'Times New Roman',serif; font-size:150px; line-height:1;
    color:rgba(255,255,255,.055); font-weight:400; user-select:none; pointer-events:none;
  }
  /* 装饰十字星 */
  .deco-star { position:absolute; width:26px; height:26px; z-index:2; opacity:.5; }
  .deco-star::before, .deco-star::after { content:''; position:absolute; background:#c9a24b; }
  .deco-star::before { left:50%; top:0; width:1px; height:100%; transform:translateX(-50%); }
  .deco-star::after { top:50%; left:0; height:1px; width:100%; transform:translateY(-50%); }
  .deco-star.tl { top:14px; left:14px; }
  /* 装饰竖线 */
  .deco-vline { position:absolute; width:1px; background:linear-gradient(to bottom,transparent,rgba(201,162,75,.35),transparent); z-index:2; }
  .deco-vline.left { left:40px; top:52px; height:120px; }
  /* 点阵 */
  .deco-dots { position:absolute; right:18px; top:60px; z-index:2; opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:6px 6px; width:24px; height:90px; }

  /* 椭圆立绘区域 */
  .portrait-clip {
    position:absolute; left:50%; top:52px; transform:translateX(-50%);
    width:286px; height:380px; border-radius:50% 50% 46% 46% / 42% 42% 58% 58%;
    overflow:hidden; z-index:3;
    background:radial-gradient(circle at 50% 30%, rgba(111,195,223,.10), rgba(0,0,0,.25));
    box-shadow: inset 0 0 40px rgba(0,0,0,.5);
  }
  /* 预处理立绘已裁成椭圆比例(572x760=2x)，直接精确铺满，一次性采样最清晰 */
  .portrait-clip img {
    width:100%; height:100%; object-fit:cover; object-position:center top;
    display:block; image-rendering:auto;
  }
  /* 立绘底部柔和融入卡片(终止色=椭圆底边处卡片背景色，避免出现硬分割线) */
  .portrait-fade {
    position:absolute; left:0; right:0; bottom:0; height:110px; z-index:4;
    background:linear-gradient(to bottom,rgba(19,24,35,0) 0%,rgba(19,24,35,.55) 55%,#131823 100%);
  }

  /* 定位徽章（左上角） */
  .pos-badge {
    position:absolute; top:16px; right:16px; z-index:6;
    padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600;
    background:rgba(201,162,75,.16); border:1px solid rgba(201,162,75,.5); color:#e8d4a0;
    backdrop-filter:blur(4px);
  }

  /* 名字区域 */
  .card-foot { position:absolute; left:0; right:0; bottom:52px; z-index:6; text-align:center; }
  .card-name-tag {
    display:inline-block; padding:5px 22px;
    text-shadow:0 2px 10px rgba(0,0,0,.85);
    font-size:17px; font-weight:700; color:#f0f2f6; letter-spacing:3px;
  }
  /* 底部元素条 */
  .elem-bar {
    position:absolute; left:14px; right:14px; bottom:12px; z-index:6; height:30px;
    text-shadow:0 1px 6px rgba(0,0,0,.9);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; color:#9aa3b5;
  }
  .elem-icon { width:16px; height:16px; object-fit:contain; display:inline-block; filter:drop-shadow(0 0 3px rgba(255,255,255,.15)); }
  .elem-sep { width:1px; height:14px; background:#333d50; }

  /* 配队说明区 */
  .team-desc { max-width:1100px; margin:0 auto; }
  .desc-card {
    background:rgba(17,22,31,.6); border:1px solid #232b39; border-radius:12px; padding:20px 24px;
    border-left:3px solid #c9a24b;
  }
  .desc-title { font-size:15px; font-weight:700; color:#c9a24b; margin-bottom:10px; }
  .desc-text { font-size:13px; color:#aab2c2; line-height:2; }
  .desc-text b { color:#6fc3df; font-weight:600; }

  /* 每套配队区块 */
  .team-block { margin-bottom:46px; }
  .team-block:last-child { margin-bottom:10px; }
  .team-block-title {
    max-width:1100px; margin:0 auto 18px; font-size:17px; font-weight:700; color:#e6e8ee;
    padding-bottom:10px; border-bottom:1px solid #2a3346; display:flex; align-items:baseline; gap:14px;
  }
  .team-block-members { font-size:12px; font-weight:400; color:#7a8499; letter-spacing:1px; }
  .build-btn {
    margin-left:auto; padding:6px 18px; border-radius:8px; cursor:pointer;
    background:linear-gradient(135deg,#c9a24b,#a8862f); border:none; flex-shrink:0; align-self:center;
    color:#0a0d13; font-size:13px; font-weight:700; font-family:inherit; letter-spacing:1px;
    transition:all .15s;
  }
  .build-btn:hover { filter:brightness(1.15); box-shadow:0 4px 14px rgba(201,162,75,.35); }

  /* 手法教学链接卡片 */
  .guide-card {
    display:flex; align-items:center; gap:12px; max-width:1100px; margin:14px auto 0;
    padding:14px 20px; border-radius:12px; text-decoration:none;
    background:linear-gradient(90deg,rgba(201,162,75,.14),rgba(111,195,223,.06));
    border:1px solid rgba(201,162,75,.4); color:#e6e8ee; transition:all .18s;
  }
  .guide-card:hover { border-color:#c9a24b; transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .guide-icon { color:#c9a24b; font-size:13px; flex-shrink:0; }
  .guide-text { font-size:14px; font-weight:600; color:#f0d9a8; white-space:nowrap; }
  .guide-link { font-size:14px; white-space:nowrap; flex-shrink:0; margin-left:auto; }
  .guide-br { color:#ffffff; font-weight:700; }
  .guide-go { color:#6fc3df; font-weight:600; }
  .guide-arrow { color:#c9a24b; font-size:20px; flex-shrink:0; }

  .empty-tip { text-align:center; padding:100px 20px; color:#7a8499; font-size:15px; }

/* 禁止拖动图片资源（CSS 之外的 JS 兜底） */
document.addEventListener('dragstart', (e) => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 配队序号中文数字 */
const CN_NUM = ['一','二','三','四','五','六','七','八','九','十'];
/* 配队简称：取每名成员名字的第一个字（如 爱弥斯/达妮娅/千咲 -> 爱达千），
   配队标题与教学链接文案统一由此生成，新增配队无需手写 */
function teamAbbr(team){ return team.members.map(m => m.name[0]).join(''); }

  let h = '';
  h += '<div class="role-card">';
  h += '<div class="card-index">' + (idx + 1) + '</div>';

  h += '<div class="deco-dots"></div>';
  h += '<div class="pos-badge">' + escapeHtml(m.pos) + ' · ' + escapeHtml(m.elem) + '</div>';
  h += '<div class="portrait-clip"><img src="' + portraitCard + '" data-full="' + portraitFull + '" onerror="if(this.dataset.full){this.src=this.dataset.full;this.dataset.full=\'\'}" alt="' + escapeHtml(m.name) + '"><div class="portrait-fade"></div></div>';
  h += '<div class="card-foot">';
  h += '<span class="card-name-tag">' + escapeHtml(m.name) + '</span>';
  h += '</div>';
  h += '<div class="elem-bar">';
  h += '<img class="elem-icon" src="/res/Project/Icons/' + encodeURIComponent('元素-' + m.elem) + '.png" alt="' + escapeHtml(m.elem) + '" onerror="this.style.display=\'none\'"><span>' + escapeHtml(m.elem) + '</span>';
  h += '<span class="elem-sep"></span><span>队伍位置：' + cn + '号位</span>';
  h += '</div>';
  h += '</div>';
  return h;
}

function main() {
  const mainName = new URLSearchParams(location.search).get('main') || '';
  document.getElementById('teamTitle').textContent = mainName ? mainName + ' · 推荐配队' : '角色配队';
  const data = TEAM_DATA[mainName];
  const box = document.getElementById('teamContent');

  /* 设置页面背景图（加深色蒙层保证可读性；爱弥斯背景较亮，蒙层单独加深到75%，其余55%） */
  if (data && data.background) {
    const dim = (mainName === '爱弥斯' || mainName === '弗洛洛' || mainName === '赞妮' || mainName === '椿' || mainName === '长离' || mainName === '今汐') ? .75 : .55;
    document.body.style.backgroundImage =
      'linear-gradient(rgba(10,13,19,' + dim + '),rgba(10,13,19,' + dim + ')),url("' + data.background + '")';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center top';
    document.body.style.backgroundAttachment = 'fixed';
    document.body.style.backgroundRepeat = 'no-repeat';
  }

  if (!data) {
    box.innerHTML = '<div class="empty-tip">「' + escapeHtml(mainName) + '」的配队方案正在整理中，敬请期待。<br><br>目前已开放：爱弥斯 · 绯雪 · 秧秧·玄翎 · 清霄 · 露西 · 西格莉卡 · 陆·赫斯 · 嘉贝莉娜 · 奥古斯塔 · 弗洛洛 · 卡提希娅 · 赞妮 · 珂莱塔 · 椿 · 长离 · 今汐 · 忌炎</div>';
    return;
  }
  document.getElementById('teamSub').textContent = '共 ' + data.teams.length + ' 套推荐编队';

  let html = '';
  data.teams.forEach((team, ti) => {
    const abbr = teamAbbr(team);
    /* 配队标题（自动生成：配队N · 成员首字简称） */
    html += '<div class="team-block">';
    html += '<div class="team-block-title">配队' + (CN_NUM[ti] || ti + 1) + ' · ' + escapeHtml(abbr) + '<span class="team-block-members">' + team.members.map(m=>m.name).join(' · ') + '</span>';
    /* 配队养成按钮（跳转养成模版页，携带配队序号） */
    if (team.hasBuild) {
      html += '<button class="build-btn" onclick="window.open(\'/team_build.html?main=' + encodeURIComponent(mainName) + '&team=' + ti + '\',\'_blank\')">配队养成</button>';
    }
    html += '</div>';
    /* 三张卡片 */
    html += '<div class="team-row">';
    team.members.forEach((m, i) => { html += renderCard(m, i); });
    html += '</div>';
    /* 配队思路 */
    html += '<div class="team-desc"><div class="desc-card"><div class="desc-title">配队思路</div><div class="desc-text">' + team.desc + '</div></div></div>';
    /* 手法教学链接（不显示原始链接，显示 [点击以前往]：括号白色、文字蓝色）；
       无教学链接的配队显示 [联系开发者前去提供]，点击打开联系页 */
    if (team.guide && team.guide.contact) {
      html += '<a class="guide-card" href="/contact.html" target="_blank" rel="noopener">';
      html += '<span class="guide-icon">▶</span>';
      html += '<span class="guide-text">暂无教学链接</span>';
      html += '<span class="guide-link"><span class="guide-br">[</span><span class="guide-go">联系开发者前去提供</span><span class="guide-br">]</span></span>';
      html += '<span class="guide-arrow">›</span>';
      html += '</a>';
    } else if (team.guide) {
      html += '<a class="guide-card" href="' + team.guide.url + '" target="_blank" rel="noopener">';
      html += '<span class="guide-icon">▶</span>';
      html += '<span class="guide-text">前去学习' + escapeHtml(abbr) + '手法教学</span>';
      html += '<span class="guide-link"><span class="guide-br">[</span><span class="guide-go">点击以前往</span><span class="guide-br">]</span></span>';
      html += '<span class="guide-arrow">›</span>';
      html += '</a>';
    }
    html += '</div>';
  });
  box.innerHTML = html;
}
main();
</script>
</body>
</html>
