<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="icon" href="/res/ui/app.png" />
<title>配队养成 - 鸣潮攻略站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
/* 滚动条（与主界面一致） */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2a3342; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a4557; }
::-webkit-scrollbar-track { background: transparent; }

  img, * { -webkit-user-drag:none; user-select:none; -webkit-user-select:none; }
  body {
    background: #0a0d13;
    background-image: radial-gradient(1200px 700px at 50% -20%, #14202e 0%, #0a0d13 60%);
    color: #e6e8ee;
    font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
    min-height: 100vh;
    padding: 28px 32px 48px;
  }
  .wrap { max-width: 1280px; margin:0 auto; }

  /* 顶部 */
  .top-bar { display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .back-btn {
    display:inline-block; padding:8px 18px; border-radius:8px;
    background:#141a26; border:1px solid #2a3346; color:#c8cdd5;
    font-size:13px; text-decoration:none; cursor:pointer; transition:all .15s;
  }
  .back-btn:hover { border-color:#c9a24b; color:#c9a24b; }
  .top-title { font-size:22px; font-weight:700; color:#c9a24b; letter-spacing:2px; }
  .top-sub { font-size:13px; color:#7a8499; margin-left:4px; }

  /* 单个角色养成区块：立绘 | 属性模版 | 首位声骸 */
  .build-row {
    display:flex; align-items:stretch; gap:24px;
    max-width:1100px; margin:0 auto 34px;
    background: rgba(20,26,37,.62);
    border:1px solid #2e384a; border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    padding:22px 26px; overflow:hidden;
  }
  /* 左侧人物立绘 */
  .build-portrait {
    flex-shrink:0; width:190px; height:460px; border-radius:10px; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 25%, rgba(111,195,223,.10), rgba(0,0,0,.35));
    border:1px solid #2a3346;
  }
  /* 预处理立绘已裁成 190:460 比例(380x920=2x)，直接精确铺满，一次性采样最清晰 */
  .build-portrait img {
    width:100%; height:100%; object-fit:cover; object-position:center top; display:block;
  }
  .build-portrait-name {
    position:absolute; left:0; right:0; bottom:0; padding:8px 0; text-align:center;
    background:linear-gradient(to bottom,rgba(10,13,19,0),rgba(10,13,19,.9));
    font-size:15px; font-weight:700; letter-spacing:2px; color:#f0f2f6;
    text-shadow:0 2px 8px rgba(0,0,0,.9);
  }
  /* 中间属性模版 */
  .build-mid { flex:1; min-width:0; display:flex; flex-direction:column; }
  .build-name { font-size:17px; font-weight:700; color:#c9a24b; letter-spacing:2px; margin-bottom:12px; }
  .stat-table {
    width:100%; border-collapse:collapse; font-size:13px;
    border:1px solid #2a3346; border-radius:8px; overflow:hidden;
  }
  .stat-table th {
    background:rgba(201,162,75,.14); color:#e8d4a0; font-weight:600;
    padding:9px 16px; text-align:left; border-bottom:1px solid #2a3346; letter-spacing:1px;
  }
  .stat-table td {
    padding:8px 16px; color:#c8cdd5; border-bottom:1px solid #232b39;
  }
  .stat-table tr:last-child td { border-bottom:none; }
  .stat-table tr:nth-child(even) td { background:rgba(255,255,255,.02); }
  .stat-table td.attr { color:#8fa8c8; width:38%; }
  .stat-table td.val { color:#e6e8ee; font-weight:600; }
  /* 表格下方：声骸合鸣套装建议（注意行弱化显示） */
  .res-lines { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .res-line { font-size:13px; color:#e8d4a0; line-height:1.9; }
  .res-line.note { font-size:12px; color:#9aa3b5; }
  .res-icon {
    width:20px; height:20px; object-fit:contain;
    vertical-align:-5px; margin:0 3px 0 1px;
  }
  /* 右侧首位声骸（支持多选声骸，立绘并排） */
  .build-echo {
    flex-shrink:0; width:250px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:10px 6px;
    border-left:1px solid #232b39;
  }
  .build-echo-text { font-size:14px; color:#d8dce4; line-height:1.9; }
  .build-echo-text b { color:#c9a24b; font-size:15px; letter-spacing:1px; }
  .build-echo-imgs { display:flex; gap:10px; align-items:center; }
  .build-echo-imgs img {
    width:140px; height:140px; object-fit:contain; border-radius:50%;
    border:2px solid rgba(201,162,75,.5); background:rgba(0,0,0,.3);
    box-shadow:0 0 24px rgba(201,162,75,.18);
  }
  .build-echo-imgs.multiple img { width:105px; height:105px; }

  .empty-tip { text-align:center; padding:100px 20px; color:#7a8499; font-size:15px; }
</style>

function row(name, stats, echoName, echoDir, resonance) {
  const r = {
    name: name,
    portrait: '/res/Project/角色养成/' + encodeURIComponent(name) + '.webp?v=4',
    stats: stats,
    resonance: resonance || []

    r.echo = {
      name: echoName,
      img: '/res/Project/声骸/' + (echoDir || '海啸级') + '/' + encodeURIComponent(echoName) + '.png'
    };
  }
  return r;
}

/* 禁止拖动图片资源（CSS 之外的 JS 兜底） */
document.addEventListener('dragstart', (e) => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function main() {
  const mainName = new URLSearchParams(location.search).get('main') || '';
  document.getElementById('buildTitle').textContent = mainName ? mainName + ' · 配队养成' : '配队养成';
  const data = BUILD_DATA[mainName];
  const teamIdx = parseInt(new URLSearchParams(location.search).get('team') || '0', 10) || 0;
  const builds = Array.isArray(data) ? data : (data ? [data] : null);
  const build = builds ? (builds[teamIdx] || builds[0]) : null;
  const box = document.getElementById('buildContent');

  /* 设置页面背景图（加深色蒙层保证可读性；爱弥斯背景较亮，蒙层单独加深到75%，其余55%） */
  if (build && build.background) {
    const dim = (mainName === '爱弥斯' || mainName === '弗洛洛' || mainName === '赞妮' || mainName === '椿' || mainName === '长离' || mainName === '今汐') ? .75 : .55;
    document.body.style.backgroundImage =
      'linear-gradient(rgba(10,13,19,' + dim + '),rgba(10,13,19,' + dim + ')),url("' + build.background + '")';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center top';
    document.body.style.backgroundAttachment = 'fixed';
    document.body.style.backgroundRepeat = 'no-repeat';
  }

  const rows = build ? build.rows : null;
  if (!rows) {
    box.innerHTML = '<div class="empty-tip">「' + escapeHtml(mainName) + '」的配队养成模版正在整理中，敬请期待。<br><br>目前已开放：爱弥斯 · 绯雪 · 秧秧·玄翎 · 清霄 · 露西 · 西格莉卡 · 陆·赫斯 · 嘉贝莉娜 · 奥古斯塔 · 弗洛洛 · 卡提希娅 · 赞妮 · 珂莱塔 · 椿 · 长离 · 今汐 · 忌炎</div>';
    return;
  }
  document.getElementById('buildSub').textContent = rows.length + ' 名角色养成模版';

  let html = '';
  rows.forEach(row => {
    /* 属性模版表格（Markdown 模版渲染） */
    let table = '<table class="stat-table"><tr><th>属性</th><th>数值</th></tr>';
    row.stats.forEach(([k, v]) => {
      table += '<tr><td class="attr">' + escapeHtml(k) + '</td><td class="val">' + escapeHtml(v) + '</td></tr>';
    });
    table += '</table>';

    /* 声骸合鸣套装建议（《名称》替换为图标+名称） */
    let resHtml = '';
    (row.resonance || []).forEach(line => {
      const isNote = line.startsWith('注意');
      const body = escapeHtml(line).replace(/《([^》]+)》/g, (m, n) =>
        '<img class="res-icon" src="/res/Project/合鸣效果/' + encodeURIComponent(n) + '.png" alt="' + n + '" title="' + n + '" onerror="this.style.display=\'none\'">' + n
      );
      resHtml += '<div class="res-line' + (isNote ? ' note' : '') + '">' + body + '</div>';
    });

    html += '<div class="build-row">';
    html += '<div class="build-portrait"><img src="' + row.portrait + '" data-full="/res/Project/角色/' + encodeURIComponent(row.name) + '.webp" onerror="if(this.dataset.full){this.src=this.dataset.full;this.dataset.full=\'\'}" alt="' + escapeHtml(row.name) + '"><div class="build-portrait-name">' + escapeHtml(row.name) + '</div></div>';
    html += '<div class="build-mid"><div class="build-name">' + escapeHtml(row.name) + ' · 养成模版</div>' + table + (resHtml ? '<div class="res-lines">' + resHtml + '</div>' : '') + '</div>';
    const echoes = row.echo ? (Array.isArray(row.echo) ? row.echo : [row.echo]) : null;
    if (echoes) {
      const echoNames = echoes.map(e => e.name).join(' / ');
      html += '<div class="build-echo"><div class="build-echo-text">首位声骸建议携带<br><b>' + escapeHtml(echoNames) + '</b></div>';
      html += '<div class="build-echo-imgs' + (echoes.length > 1 ? ' multiple' : '') + '">';
      echoes.forEach(e => {
        html += '<img src="' + e.img + '" alt="' + escapeHtml(e.name) + '" title="' + escapeHtml(e.name) + '" onerror="this.style.display=\'none\'">';
      });
      html += '</div></div>';
    }
    html += '</div>';
  });
  box.innerHTML = html;
}
main();
